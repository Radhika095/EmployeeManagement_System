[build]
  command = "npm run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"

# Single-page app: serve index.html for client-side routes like /login
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173
